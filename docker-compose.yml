# Full stack: http://localhost:5500 (dashboard) -> :8080 (Rust API) -> Redis -> worker (Sarvam AI API)
#                                     \-> Sarvam speech-to-text (consent check, audio -> script)
# Usage: cp .env.example .env  (set JWT_SECRET and SARVAM_API_KEY), then: docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: voiceclone
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d voiceclone"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-rust:
    build: ./backend-rust
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/voiceclone
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      SARVAM_API_KEY: ${SARVAM_API_KEY:?Set SARVAM_API_KEY in .env (https://dashboard.sarvam.ai)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
      PORT: 8080

  worker-python:
    build: ./worker-python
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend-rust: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/voiceclone
      REDIS_URL: redis://redis:6379/0
      SARVAM_API_KEY: ${SARVAM_API_KEY:?Set SARVAM_API_KEY in .env (https://dashboard.sarvam.ai)}
      SARVAM_LANGUAGE: ${SARVAM_LANGUAGE:-}
      SARVAM_REMOVE_NOISE: ${SARVAM_REMOVE_NOISE:-false}

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5500:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./frontend:/usr/share/nginx/html/frontend:ro

volumes:
  postgres_data:
  redis_data:

# Full stack: http://localhost:5500 (dashboard) -> :8080 (Rust API) -> Redis -> worker (Chatterbox)
#                                                    \-> :8000 (Whisper: consent check, audio -> script)
# Usage: cp .env.example .env  (set JWT_SECRET), then:
#   NVIDIA GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#   CPU only:   docker compose up --build    (set TORCH_VARIANT=cpu in .env for a smaller image)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: voiceclone
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d voiceclone"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  speech-pipeline:
    build: ./speech_pipeline
    restart: unless-stopped
    environment:
      WHISPER_DEVICE: cpu
      WHISPER_MODEL_CPU: ${WHISPER_MODEL_CPU:-base}
      STORAGE_DIR: /app/storage
      SQLITE_DB_PATH: /app/storage/pipeline.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - pipeline_storage:/app/storage
      - model_cache:/root/.cache/huggingface

  backend-rust:
    build: ./backend-rust
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      speech-pipeline: { condition: service_started }
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/voiceclone
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      STORAGE_DIR: /app/private_storage
      SPEECH_PIPELINE_URL: http://speech-pipeline:8000
      ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      PORT: 8080
    volumes:
      - private_storage:/app/private_storage

  worker-python:
    build:
      context: ./worker-python
      args:
        TORCH_VARIANT: ${TORCH_VARIANT:-cu124}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend-rust: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/voiceclone
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/private_storage
      CHATTERBOX_MODEL: ${CHATTERBOX_MODEL:-turbo}
      CHATTERBOX_DEVICE: ${CHATTERBOX_DEVICE:-auto}
    volumes:
      - private_storage:/app/private_storage
      - model_cache:/root/.cache/huggingface

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5500:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./main.js:/usr/share/nginx/html/main.js:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./fonts:/usr/share/nginx/html/fonts:ro
      - ./frontend:/usr/share/nginx/html/frontend:ro

volumes:
  postgres_data:
  redis_data:
  private_storage:
  pipeline_storage:
  model_cache:

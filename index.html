<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intelligence Designed To Evolve</title>

  <!-- Google Fonts: Inter 400, 500, 600 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- BubbledotICG-FinePos from OnlineWebFonts -->
  <link href="https://db.onlinewebfonts.com/c/8cb707a9b8a73f8a7403336b861c3074?family=BubbledotICG-FinePos" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Full-viewport cover video -->
  <div class="bg">
    <video class="bg-video" autoplay muted loop playsinline>
      <source
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260809_012548_ef22562c-c0ae-4816-ad9d-f8922af4e6a7.mp4"
        type="video/mp4"
      />
    </video>
  </div>

  <div class="page">
    <!-- 1. Header (Desktop & Mobile) -->
    <header class="header">
      <a href="#" class="logo-btn" aria-label="Intelligence - Home">
        <img src="assets/logo.webp" alt="" width="52" height="52" class="logo-img" />
      </a>

      <a href="frontend/dashboard.html" class="sign-in-btn">Sign in</a>

    </header>

    <!-- 2. Hero (Center) -->
    <main class="hero">
      <!-- What it is -->
      <div class="trust-row anim" style="--d: 0.05s;">
        <div class="trust-pill"><span>Free · Runs on your computer · Consent-verified</span></div>
      </div>

      <!-- Headline -->
      <h1 class="headline anim-headline">
        <span class="headline-line">Intelligence</span>
        <span class="headline-line">Designed To Evolve</span>
      </h1>

      <!-- Subhead -->
      <p class="subhead anim" style="--d: 0.28s;">
        Clone your own voice from a short recording, then turn any script into natural speech.
        No API keys, no usage limits.
      </p>

      <!-- CTA -->
      <div class="cta-wrap anim-cta" style="--d: 0.4s;">
        <a href="frontend/dashboard.html" class="cta-btn">Get Started</a>
      </div>
    </main>

    <!-- 3. Stats Footer -->
    <footer class="stats-footer">
      <div class="stat-item anim" style="--d: 0.50s;">
        <span class="stat-icon">&lt;</span>
        <div class="stat-content">
          <span class="stat-value">10s</span>
          <span class="stat-label">Voice sample</span>
        </div>
      </div>
      <div class="stat-item anim" style="--d: 0.58s;">
        <span class="stat-icon">#</span>
        <div class="stat-content">
          <span class="stat-value">0</span>
          <span class="stat-label">API keys needed</span>
        </div>
      </div>
      <div class="stat-item anim" style="--d: 0.66s;">
        <span class="stat-icon">%</span>
        <div class="stat-content">
          <span class="stat-value">100%</span>
          <span class="stat-label">Runs locally</span>
        </div>
      </div>
      <div class="stat-item anim" style="--d: 0.74s;">
        <span class="stat-icon">*</span>
        <div class="stat-content">
          <span class="stat-value">MP3</span>
          <span class="stat-label">Download</span>
        </div>
      </div>
    </footer>
  </div>

</body>
</html>
